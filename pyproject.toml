[project]
name = "architecture-agent"
version = "0.1.0"
description = "Architecture Engineering Agent: software architecture, infrastructure, cloud, cost and review capabilities exposed over MCP."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Architecture Agent Team" }]
keywords = ["architecture", "mcp", "agent", "cloud", "infrastructure", "c4", "adr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "duckduckgo-search>=8.1.1",
    "fastmcp>=4.0.11",
    "httpx>=0.28.1",
    "langchain>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
]

[project.urls]
Documentation = "https://github.com/architecture-agent/architecture_mcp/tree/main/docs"

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pip-audit>=2.10.1",
    "pre-commit>=4.0,<5",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/architecture_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CLAUDE.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "." as well as "src": tests import the `scripts` package, and relying on
# rootdir heuristics to make it importable fails when the checkout is moved.
pythonpath = ["src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring adapters or infrastructure",
    "mcp: tests exercising the MCP server contract",
    "e2e: end-to-end scenarios",
    "security: adversarial and prompt-injection tests",
    "evaluation: AI evaluation dataset and scorers",
    "performance: load and latency tests",
]
filterwarnings = ["error", "ignore::DeprecationWarning:pydantic.*"]

[tool.coverage.run]
branch = true
source = ["src/architecture_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # no print in library code
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "S",      # bandit
    "ASYNC",  # flake8-async
    "PTH",    # prefer pathlib
    "ARG",    # unused arguments
    "D",      # pydocstyle
]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "S101", "ARG001", "ARG002"]
"scripts/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# Negative tests deliberately construct models with the raw types Pydantic coerces at
# runtime, so that factory kwargs stay loosely typed instead of enumerating every
# field. Anything the Pydantic plugin reports directly (missing required fields, raw
# values Pydantic would coerce) is silenced with explicit ``type: ignore`` comments,
# because the plugin's synthetic constructor errors ignore ``disable_error_code``.
[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["arg-type"]

[tool.uv]
package = true
